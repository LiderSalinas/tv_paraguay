name: tv_paraguay
description: App de TV Paraguay para reproducir canales nacionales.
publish_to: "none"

version: 1.2.1+5

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  video_player: ^2.9.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  video_player_platform_interface: 6.6.0

flutter:
  uses-material-design: true

  assets:
    - canales.json
    - assets/branding/tv_paraguay_logo.jpg
    - assets/fonts/OFL.txt

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
