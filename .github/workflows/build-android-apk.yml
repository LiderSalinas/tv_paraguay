name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/embed-player
      - codex/remote-channel-refresh
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "android/**"
      - "lib/**"
      - "canales.json"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-paraguay-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
