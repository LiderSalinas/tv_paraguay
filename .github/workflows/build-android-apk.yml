name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/embed-player
      - codex/remote-channel-refresh
      - codex/renovacion-canales-hls
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "android/**"
      - "branding/**"
      - "lib/**"
      - "tools/**"
      - "test/**"
      - "canales.json"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Preparar logo, iconos y Manrope
        run: python tools/prepare_branding.py

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Probar reproducción, controles y diseño
        run: flutter test

      - name: Guardar vistas del diseño
        uses: actions/upload-artifact@v4
        with:
          name: tv-paraguay-vistas-ux
          path: build/ux-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Compilar APK
        env:
          TV_PARAGUAY_TEST_APK: ${{ github.ref_name == 'codex/renovacion-canales-hls' && '1' || '0' }}
        run: flutter build apk --release --split-per-abi

      - name: Guardar APK para teléfono
        uses: actions/upload-artifact@v4
        with:
          name: tv-paraguay-telefono-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar APK para TV Box de 32 bits
        uses: actions/upload-artifact@v4
        with:
          name: tv-paraguay-tvbox-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14
